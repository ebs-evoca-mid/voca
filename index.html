<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이동 중...</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#f5f5f5;color:#333}
  .box{text-align:center;padding:2rem}
  .spinner{display:inline-block;width:32px;height:32px;border:3px solid #ddd;border-top-color:#666;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .err{color:#c0392b}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p id="msg">잠시만 기다려 주세요…</p>
</div>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const msg = document.getElementById("msg");

  if(!id){
    msg.className = "err";
    msg.textContent = "QR 코드 ID가 없습니다.";
    return;
  }

  try{
    const res = await fetch("./urls.json?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("데이터 로드 실패");
    const data = await res.json();

    const item = data.items[id];
    if(!item){
      msg.className = "err";
      msg.textContent = "해당 QR 코드를 찾을 수 없습니다. (ID: " + id + ")";
      return;
    }

    // KST(한국 표준시) 기준 날짜 계산
    const now = new Date();
    const kstMs = now.getTime() + (now.getTimezoneOffset() * 60000) + (9 * 3600000);
    const kst = new Date(kstMs);
    const today = kst.toISOString().slice(0, 10); // YYYY-MM-DD

    const switchDate = data.switchDate || "2026-09-01";
    const url = today < switchDate ? item.beforeUrl : item.afterUrl;

    if(!url){
      msg.className = "err";
      msg.textContent = "이동할 주소가 비어 있습니다.";
      return;
    }

    location.replace(url);
  }catch(e){
    msg.className = "err";
    msg.textContent = "오류: " + e.message;
  }
})();
</script>
</body>
</html>
